<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your Task Manager Pro account.">
  <title>Create Account — Task Manager Pro</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <div class="ambient-glow"></div>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="/" style="display:inline-block;">
          <div class="brand-logo">✓</div>
        </a>
        <h1 class="auth-title">Create Account</h1>
        <p>Start organizing your tasks with ease</p>
      </div>

      <form id="registerForm">
        <div class="form-group">
          <label class="form-label" for="regName">Full Name</label>
          <div class="input-icon-wrapper">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <input 
              type="text" 
              id="regName" 
              class="form-control" 
              placeholder="e.g. Jane Doe" 
              required 
              autocomplete="name"
            />
          </div>
          <div id="regNameError" class="form-error"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regEmail">Email Address</label>
          <div class="input-icon-wrapper">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            <input 
              type="email" 
              id="regEmail" 
              class="form-control" 
              placeholder="name@example.com" 
              required 
              autocomplete="email"
            />
          </div>
          <div id="regEmailError" class="form-error"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regPassword">Password (minimum 6 characters)</label>
          <div class="input-icon-wrapper">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <input 
              type="password" 
              id="regPassword" 
              class="form-control" 
              placeholder="••••••••" 
              required 
              minlength="6"
              autocomplete="new-password"
            />
          </div>
          <div id="regPasswordError" class="form-error"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regPasswordConfirm">Confirm Password</label>
          <div class="input-icon-wrapper">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <input 
              type="password" 
              id="regPasswordConfirm" 
              class="form-control" 
              placeholder="••••••••" 
              required 
              minlength="6"
              autocomplete="new-password"
            />
          </div>
          <div id="regConfirmError" class="form-error"></div>
        </div>

        <button type="submit" id="regSubmitBtn" class="btn btn-primary" style="width:100%; padding:0.8rem; margin-top:0.5rem;">
          Create Free Account
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login" style="font-weight:600;">Sign in here</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    // Redirect if already logged in
    auth.checkAuthGuard(true);

    const form = document.getElementById('registerForm');
    const submitBtn = document.getElementById('regSubmitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirmPassword = document.getElementById('regPasswordConfirm').value;

      document.getElementById('regNameError').textContent = '';
      document.getElementById('regEmailError').textContent = '';
      document.getElementById('regPasswordError').textContent = '';
      document.getElementById('regConfirmError').textContent = '';

      if (password !== confirmPassword) {
        document.getElementById('regConfirmError').textContent = 'Passwords do not match';
        utils.showToast('Passwords do not match', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating Account...';

      try {
        await auth.register(name, email, password);
        utils.showToast('Account registered successfully!', 'success');
        setTimeout(() => {
          window.location.href = '/dashboard';
        }, 400);
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Free Account';

        if (err.errors) {
          if (err.errors.name) document.getElementById('regNameError').textContent = err.errors.name;
          if (err.errors.email) document.getElementById('regEmailError').textContent = err.errors.email;
          if (err.errors.password) document.getElementById('regPasswordError').textContent = err.errors.password;
        }
        utils.showToast(err.message || 'Registration failed', 'error');
      }
    });
  </script>
</body>
</html>
